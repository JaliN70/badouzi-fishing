		<script>
// index.wasm 是 gzip 壓縮過的：在瀏覽器裡解壓後再交給引擎
(function () {
	const origFetch = window.fetch.bind(window);
	window.fetch = async function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		const res = await origFetch(input, init);
		if (!/\.wasm(\?|$)/.test(url) || !res.ok || typeof DecompressionStream === 'undefined') {
			return res;
		}
		const buf = new Uint8Array(await res.clone().arrayBuffer());
		if (!(buf[0] === 0x1f && buf[1] === 0x8b)) {
			return res;
		}
		const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
		return new Response(stream, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
	};
})();
</script>
<style>

<script>
// 安裝提示（網頁版安裝成 App）
(function () {
	const KEY = 'fk-install-dismissed';
	const ua = navigator.userAgent || '';
	const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const isAndroid = /Android/.test(ua);
	const isIOSOther = isIOS && /CriOS|FxiOS|EdgiOS/.test(ua);
	let deferred = null;
	let box = null;

	function standalone() {
		return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
			(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
			navigator.standalone === true;
	}
	function dismissedRecently() {
		try { return Date.now() - Number(localStorage.getItem(KEY) || 0) < 3 * 24 * 3600 * 1000; } catch (e) { return false; }
	}
	function remember() { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} }

	function build(title, desc, primary) {
		hide();
		box = document.createElement('div');
		box.id = 'fk-install';
		box.setAttribute('role', 'dialog');
		box.setAttribute('aria-label', title);
		box.innerHTML = '<img src="index.192x192.png" alt="">' +
			'<div style="flex:1"><div class="t"></div><div class="d"></div></div><div class="btns"></div>';
		box.querySelector('.t').textContent = title;
		box.querySelector('.d').innerHTML = desc;
		const btns = box.querySelector('.btns');
		if (primary) {
			const b = document.createElement('button');
			b.textContent = primary.label;
			b.onclick = primary.run;
			btns.appendChild(b);
		}
		const no = document.createElement('button');
		no.className = 'no';
		no.textContent = primary ? '之後再說' : '知道了';
		no.onclick = function () { remember(); hide(); };
		btns.appendChild(no);
		document.body.appendChild(box);
		requestAnimationFrame(function () { requestAnimationFrame(function () { box.classList.add('show'); }); });
	}
	function hide() {
		if (box) { const b = box; box = null; b.classList.remove('show'); setTimeout(function () { b.remove(); }, 400); }
	}
	function promptInstall() {
		if (!deferred) { return; }
		const p = deferred;
		deferred = null;
		p.prompt();
		p.userChoice.then(function (r) { if (r && r.outcome !== 'accepted') { remember(); } }).catch(function () {});
		hide();
	}
	function showIOS() {
		const how = isIOSOther
			? '點網址列旁邊的<span class="share"></span>「分享」，選<b>「加入主畫面」</b>。找不到的話，用 <b>Safari</b> 開這個網址再試一次。'
			: '點畫面下方的<span class="share"></span>「分享」，往下滑選<b>「加入主畫面」</b>，再按右上角的「新增」。';
		build('把釣魚王加到主畫面', how + '<br>之後從主畫面打開就是全螢幕。', null);
	}
	function showPrompt() {
		build('安裝釣魚王', '裝到桌面或主畫面，<b>全螢幕</b>開啟、載入更快，像 App 一樣玩。',
			{ label: '安裝', run: promptInstall });
	}
	function showGeneric() {
		build('安裝釣魚王', isAndroid
			? '點瀏覽器右上角的「⋮」選單，選<b>「安裝應用程式」</b>或<b>「加到主畫面」</b>。'
			: '在瀏覽器網址列右邊找<b>「安裝」</b>圖示（電腦版 Chrome／Edge），或從選單選「安裝釣魚王」。', null);
	}

	window.addEventListener('beforeinstallprompt', function (e) {
		e.preventDefault();
		deferred = e;
		if (!standalone() && !dismissedRecently()) {
			setTimeout(function () { if (deferred && !box) { showPrompt(); } }, 6000);
		}
	});
	window.addEventListener('appinstalled', function () {
		deferred = null;
		hide();
		build('安裝完成！', '之後可以直接從桌面或主畫面打開<b>釣魚王</b>。', null);
		setTimeout(hide, 5000);
	});
	window.addEventListener('load', function () {
		if (isIOS && !standalone() && !dismissedRecently()) {
			setTimeout(function () { if (!box) { showIOS(); } }, 8000);
		}
	});

	// 給遊戲裡的「安裝到主畫面」按鈕用
	window.fishingKing = {
		isStandalone: standalone,
		canOffer: function () { return !standalone() && (deferred !== null || isIOS || isAndroid); },
		showInstall: function () {
			if (standalone()) { return 'installed'; }
			if (deferred) { promptInstall(); return 'prompt'; }
			if (isIOS) { showIOS(); return 'ios'; }
			showGeneric();
			return 'generic';
		},
	};
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"mainPack":"game-data.wasm","fileSizes":{"game-data.wasm":2850052,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
